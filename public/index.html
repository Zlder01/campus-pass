<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campus Pass Mockup - 경희대학교 버스 도착 예측</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --crimson: #9b1b30;
    --crimson-deep: #6f1222;
    --crimson-tint: #f6e6e9;
    --ground: #eef0f3;
    --surface: #ffffff;
    --ink: #15171c;
    --ink-2: #4f5562;
    --line: #d4d8df;
    --plate: #1d2027;
    --plate-ink: #ffffff;
    --plate-ink-2: #b9bec9;
    --amber-tint: #fdf0dc;
    --amber-ink: #6b3b00;
    --focus: #1d5fd1;
    --radius: 12px;
    --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #c9ced6;
    font-family: var(--font);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }
  ::selection { background: var(--crimson); color: #fff; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  h1, h2, h3 { margin: 0; }

  /* Top Review Control Bar */
  .review {
    flex: none;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 16px;
    background: #2a2e36; color: #dfe2e8; font-size: 13px;
    flex-wrap: wrap;
  }
  .review-group { display: flex; align-items: center; gap: 8px; }
  .review-seg { display: inline-flex; background: #15171c; border-radius: 8px; padding: 3px; }
  .review-seg button { border: 0; background: transparent; color: #b9bec9; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 6px; min-height: 28px; }
  .review-seg button[aria-pressed="true"] { background: #fff; color: var(--ink); }
  .review-note { color: #9aa0ab; font-size: 12px; }

  .stage { flex: 1; min-height: 0; display: flex; }
  .stage.phone { align-items: safe center; justify-content: center; padding: 16px; overflow: auto; }
  .device {
    width: 390px; height: 844px; flex: none;
    border-radius: 36px; border: 10px solid #101216;
    box-shadow: 0 30px 60px -20px rgba(16, 18, 22, 0.45);
    overflow: hidden; position: relative; background: var(--ground);
  }
  @media (max-width: 500px) {
    .stage.phone { padding: 0; }
    .stage.phone .device { width: 100%; height: 100%; border: 0; border-radius: 0; box-shadow: none; }
  }
  .stage.desktop .device { width: 100%; height: 100%; border: 0; border-radius: 0; box-shadow: none; }

  .app { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--ground); }

  /* Top App Bar */
  .top { background: var(--crimson); color: #fff; padding: 12px 16px; flex: none; }
  .top-row { display: flex; align-items: center; gap: 8px; min-height: 40px; }
  .brand { font-weight: 750; font-size: 18px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
  .brand svg { width: 22px; height: 22px; }
  .page-title { font-weight: 700; font-size: 17px; flex: 1; min-width: 0; }
  .spacer { flex: 1; }
  .home-btn {
    border: 0; background: var(--crimson-deep); color: #fff; display: inline-flex; align-items: center; gap: 2px;
    font-size: 13px; font-weight: 650; padding: 0 10px 0 4px; border-radius: 8px; min-height: 36px; flex: none;
  }
  .home-btn:hover { background: #5a0e1b; }
  .home-btn svg { width: 18px; height: 18px; }
  .lang { display: inline-flex; background: var(--crimson-deep); border-radius: 999px; padding: 3px; flex: none; }
  .lang button { border: 0; background: transparent; color: #f2d3d9; font-size: 12px; font-weight: 650; padding: 3px 9px; border-radius: 999px; min-height: 26px; }
  .lang button[aria-pressed="true"] { background: #fff; color: var(--crimson-deep); }

  .scroll { overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .main { flex: 1; min-height: 0; padding-bottom: 24px; display: flex; flex-direction: column; }

  /* Landing Screen */
  .landing { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 20px 16px 24px; gap: 14px; }
  .landing-lead { font-size: 15px; color: var(--ink-2); line-height: 1.5; margin: 0 2px 2px; }
  .choices { display: flex; flex-direction: column; gap: 12px; flex: 1; }
  .choice {
    flex: 1; border: 0; border-radius: 16px; text-align: left; padding: 20px;
    display: flex; flex-direction: column; justify-content: space-between; gap: 16px;
    position: relative; overflow: hidden; min-height: 180px;
    box-shadow: 0 10px 24px -14px rgba(16, 18, 22, 0.5);
    transition: transform 200ms var(--ease-out), box-shadow 200ms var(--ease-out);
  }
  .choice:hover { transform: translateY(-2px); box-shadow: 0 14px 28px -12px rgba(16, 18, 22, 0.6); }
  .choice-map { background: var(--crimson); color: #fff; }
  .choice-bus { background: var(--plate); color: #fff; }
  .choice-title { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; }
  .choice-alt { font-size: 14px; font-weight: 550; opacity: 0.75; margin-top: 2px; }
  .choice-desc { font-size: 14px; line-height: 1.45; color: rgba(255,255,255,0.85); }
  .choice-go { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-size: 14px; }
  .choice-go svg { width: 18px; height: 18px; }
  .choice-bus .next { display: flex; align-items: baseline; gap: 8px; }
  .choice-bus .next b { font-size: 38px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1; }
  .choice-bus .next span { font-size: 13px; color: var(--plate-ink-2); }
  .landing-foot { font-size: 12px; color: var(--ink-2); text-align: center; }

  /* Bus View Specifics */
  .direction-tabs {
    display: flex; background: var(--surface); margin: 12px 16px 4px; border-radius: 10px;
    padding: 3px; border: 1px solid var(--line);
  }
  .direction-tabs button {
    flex: 1; border: 0; background: transparent; padding: 10px 8px; border-radius: 8px;
    font-size: 14px; font-weight: 700; color: var(--ink-2); text-align: center;
    transition: all 180ms ease;
  }
  .direction-tabs button[aria-selected="true"] {
    background: var(--crimson); color: #fff; box-shadow: 0 2px 6px rgba(155, 27, 48, 0.3);
  }

  .offset-info-box {
    margin: 8px 16px; padding: 10px 12px; background: var(--amber-tint); color: var(--amber-ink);
    border-radius: 8px; font-size: 12px; line-height: 1.45; display: flex; align-items: flex-start; gap: 8px;
  }
  .offset-info-box svg { width: 16px; height: 16px; flex: none; margin-top: 1px; }

  .bus-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 16px 4px; }
  .bus-meta-l { font-size: 12px; color: var(--ink-2); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .badge-sample { background: var(--amber-tint); color: var(--amber-ink); font-weight: 650; border-radius: 999px; padding: 2px 8px; font-size: 11px; }
  .badge-est { background: #fff3e0; color: #e65100; border: 1px solid #ffe0b2; font-weight: 650; border-radius: 4px; padding: 1px 5px; font-size: 10px; display: inline-block; }
  .badge-schedule { background: #e3f2fd; color: #0d47a1; border: 1px solid #bbdefb; font-weight: 650; border-radius: 4px; padding: 1px 5px; font-size: 10px; display: inline-block; }

  .refresh { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; min-height: 36px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
  .refresh:hover { border-color: var(--ink-2); }
  .refresh svg { width: 14px; height: 14px; }

  .stops { display: grid; gap: 12px; padding: 6px 16px 16px; }
  .stop { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .stop-header { display: flex; justify-content: space-between; align-items: baseline; }
  .stop h2 { font-size: 16px; font-weight: 750; }
  .stop-where { font-size: 12px; color: var(--ink-2); margin-top: 2px; }

  .arrivals { width: 100%; border-collapse: collapse; margin-top: 8px; }
  .arrivals td { padding: 8px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .arrivals tr:last-child td { border-bottom: 0; }

  .route { display: inline-block; min-width: 52px; text-align: center; font-weight: 750; font-size: 13px; padding: 3px 6px; border-radius: 6px; border: 1.5px solid var(--ink); font-variant-numeric: tabular-nums; }
  .route-m { border-color: #0055b8; color: #0055b8; background: #eef5fc; }
  .route-red { border-color: #d32f2f; color: #d32f2f; background: #fdeaea; }
  .route-green { border-color: #2e7d32; color: #2e7d32; background: #eef7ee; }

  .dest { font-size: 13px; color: var(--ink); padding-left: 8px !important; }

  .t1 { text-align: right; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .t1 small { font-size: 12px; font-weight: 600; margin-left: 0.15em; }
  .t1.soon { color: var(--crimson); }
  .t2 { display: block; font-size: 11px; font-weight: 500; color: var(--ink-2); }
  .t1.ended { font-size: 13px; color: var(--ink-2); font-weight: 600; }

  /* Map View UI */
  .map-wrap { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--line); overflow: hidden; }
  .map-wrap svg { display: block; width: 100%; height: auto; }

  /* Desktop layout tweaks */
  .desktop .top { padding: 10px 24px; }
  .desktop .landing { align-items: center; justify-content: center; padding: 40px 24px; gap: 20px; }
  .desktop .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: min(960px, 100%); }
  .desktop .choice { min-height: 300px; padding: 24px; }
  .desktop .choice-title { font-size: 32px; }

  .bus-cols { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(340px, 1fr); }
  .bus-cols .map-side { padding: 16px 24px; border-right: 1px solid var(--line); }
  .bus-cols .map-side h2 { font-size: 20px; font-weight: 750; margin-bottom: 12px; }
  .bus-cols .stops { padding: 6px 24px 24px; }
  .desktop .bus-meta { padding: 16px 24px 6px; }
</style>
</head>
<body>

<div class="review" role="group" aria-label="Mockup view controls">
  <div class="review-group">
    <span class="review-note">디스플레이:</span>
    <div class="review-seg">
      <button type="button" data-layout="auto" aria-pressed="true">자동</button>
      <button type="button" data-layout="phone" aria-pressed="false">모바일</button>
      <button type="button" data-layout="desktop" aria-pressed="false">데스크톱</button>
    </div>
  </div>

  <div class="review-group">
    <span class="review-note">데이터 모드:</span>
    <div class="review-seg">
      <button type="button" data-mode="sim" aria-pressed="false">시뮬레이션</button>
      <button type="button" data-mode="api" aria-pressed="true">실시간 API (연동됨)</button>
    </div>
  </div>
</div>

<div class="stage phone" id="stage">
  <div class="device">
    <div class="app" id="app"></div>
  </div>
</div>

<script>
const TARGET_ROUTES = [
  { name: 'M5107', type: 'm', desc: '서울역 방면 (광역급행)', interval: 12, startHour: 5, startMin: 30, endHour: 23, endMin: 20 },
  { name: '5100', type: 'red', desc: '강남역 방면 (직행좌석)', interval: 10, startHour: 5, startMin: 30, endHour: 23, endMin: 30 },
  { name: '1112', type: 'red', desc: '강변역 방면 (직행좌석)', interval: 15, startHour: 5, startMin: 40, endHour: 23, endMin: 10 },
  { name: '7000', type: 'red', desc: '사당역 방면 (직행좌석)', interval: 20, startHour: 5, startMin: 30, endHour: 23, endMin: 0 },
  { name: '1560', type: 'red', desc: '신논현역 방면 (직행좌석)', interval: 20, startHour: 5, startMin: 45, endHour: 22, endMin: 50 },
  { name: '9', type: 'green', desc: '수원역·용남고속 (일반)', interval: 15, startHour: 5, startMin: 30, endHour: 23, endMin: 0 }
];

const STATIONS = {
  inbound: [
    { id: 'gate_in', name: { ko: '경희대정문', en: 'Main Gate' }, where: { ko: '입교 방향', en: 'Inbound' }, pos: { x: 72, y: 240 } },
    { id: 'foreign_in', name: { ko: '외국어대학', en: 'Foreign Languages' }, where: { ko: '사색의 광장 방향', en: 'To Square' }, pos: { x: 140, y: 170 } },
    { id: 'life_in', name: { ko: '생명과학대', en: 'Life Sciences' }, where: { ko: '사색의 광장 방향', en: 'To Square' }, pos: { x: 210, y: 110 } },
    { id: 'square_in', name: { ko: '사색의 광장 (종점)', en: 'Square of Thought' }, where: { ko: '하차 전용', en: 'Terminus' }, pos: { x: 280, y: 50 } }
  ],
  outbound: [
    { id: 'square_out', name: { ko: '사색의 광장 (기점)', en: 'Square of Thought' }, where: { ko: '승차 기점', en: 'Departure' }, pos: { x: 280, y: 50 } },
    { id: 'life_out', name: { ko: '생명과학대·산업대학', en: 'Life & Applied Sciences' }, where: { ko: '정문 방향', en: 'To Main Gate' }, pos: { x: 210, y: 110 } },
    { id: 'foreign_out', name: { ko: '경희대체육대학·외대', en: 'Sports & Foreign Lang' }, where: { ko: '정문 방향', en: 'To Main Gate' }, pos: { x: 140, y: 170 } },
    { id: 'gate_out', name: { ko: '경희대정문 (출교)', en: 'Main Gate' }, where: { ko: '시외/수원 방면', en: 'Outbound' }, pos: { x: 72, y: 240 } }
  ]
};

const FALLBACK_OFFSETS = {
  inbound: { foreign_in: 2.0, life_in: 3.5, square_in: 5.0 },
  outbound: { square_out: 0, life_out: 1.5, foreign_out: 3.0, gate_out: 5.0 }
};

function getTimetableDeparture(routeObj) {
  const now = new Date();
  const currentMinutes = now.getHours() * 60 + now.getMinutes();
  const startMinutes = routeObj.startHour * 60 + routeObj.startMin;
  const endMinutes = routeObj.endHour * 60 + routeObj.endMin;

  if (currentMinutes < startMinutes || currentMinutes > endMinutes) {
    return null;
  }

  const elapsed = currentMinutes - startMinutes;
  const nextIn = routeObj.interval - (elapsed % routeObj.interval);
  const nextT1 = nextIn === 0 ? routeObj.interval : nextIn;
  const nextT2 = nextT1 + routeObj.interval;

  return { t1: nextT1, t2: nextT2, isTimetable: true };
}

function generateSimulationData() {
  const baseGateIn = { 'M5107': [3, 14], '5100': [2, 11], '1112': [5, 18], '7000': [8, 22], '1560': [1, 15], '9': [4, 12] };
  const baseGateOut = { 'M5107': [6, 17], '5100': [5, 14], '1112': [8, 21], '7000': [10, 25], '1560': [4, 18], '9': [7, 16] };
  const data = { inbound: {}, outbound: {} };

  STATIONS.inbound.forEach(st => {
    data.inbound[st.id] = {};
    TARGET_ROUTES.forEach(r => {
      const offset = st.id === 'gate_in' ? 0 : (FALLBACK_OFFSETS.inbound[st.id] || 0);
      const times = baseGateIn[r.name].map(t => Math.max(1, Math.round(t + offset)));
      data.inbound[st.id][r.name] = { t1: times[0], t2: times[1] };
    });
  });

  STATIONS.outbound.forEach(st => {
    data.outbound[st.id] = {};
    TARGET_ROUTES.forEach(r => {
      const off = FALLBACK_OFFSETS.outbound[st.id] || 0;
      const t1 = Math.max(1, Math.round(baseGateOut[r.name][0] + off));
      const t2 = Math.max(t1 + 3, Math.round(baseGateOut[r.name][1] + off));
      data.outbound[st.id][r.name] = { t1, t2 };
    });
  });

  return data;
}

const state = {
  lang: 'ko',
  layout: 'auto',
  page: 'landing',
  direction: 'inbound',
  dataMode: 'api',
  query: '',
  updatedAt: Date.now(),
  busRawData: generateSimulationData()
};

async function fetchRealApiData() {
  try {
    const res = await fetch('/api/bus', { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const apiRes = await res.json();

    const newRaw = { inbound: {}, outbound: {} };
    STATIONS.inbound.forEach(st => newRaw.inbound[st.id] = {});
    STATIONS.outbound.forEach(st => newRaw.outbound[st.id] = {});

    const mapStopId = (vId, dir) => {
      if (dir === 'in') {
        if (vId === 'main-gate') return 'gate_in';
        if (vId === 'foreign') return 'foreign_in';
        if (vId === 'lifesci') return 'life_in';
        if (vId === 'square') return 'square_in';
      } else {
        if (vId === 'square') return 'square_out';
        if (vId === 'lifesci-ind') return 'life_out';
        if (vId === 'pe-foreign') return 'foreign_out';
        if (vId === 'main-gate') return 'gate_out';
      }
      return null;
    };

    apiRes.stops.forEach(stop => {
      const targetId = mapStopId(stop.id, stop.dir);
      const targetDict = stop.dir === 'in' ? newRaw.inbound : newRaw.outbound;
      if (targetId && targetDict[targetId]) {
        stop.arrivals.forEach(arr => {
          targetDict[targetId][arr.route] = { t1: arr.t1, t2: arr.t2 };
        });
      }
    });

    state.busRawData = newRaw;
    state.updatedAt = Date.now();
    render();
  } catch (err) {
    console.warn('API 연동 실패, 시뮬레이션 데이터를 유지합니다:', err);
  }
}

function getProcessedStopArrivals(direction) {
  const isIn = direction === 'inbound';
  const stations = STATIONS[direction];
  const raw = state.busRawData[direction];

  const result = stations.map(st => ({
    ...st,
    arrivals: []
  }));

  TARGET_ROUTES.forEach(rt => {
    // 동적 행선지 문구 결정: 들어오는 방향은 '사색의 광장 방면', 나가는 방향은 시외 목적지
    const routeDesc = isIn ? '사색의 광장 방면' : rt.desc;

    if (isIn) {
      let baseT1 = raw['gate_in']?.[rt.name]?.t1;
      let baseT2 = raw['gate_in']?.[rt.name]?.t2;
      let isGateApi = baseT1 != null;
      let isTimetableUsed = false;

      if (!isGateApi) {
        const tt = getTimetableDeparture(rt);
        if (tt) {
          baseT1 = tt.t1;
          baseT2 = tt.t2;
          isTimetableUsed = true;
        }
      }

      stations.forEach(st => {
        let directData = raw[st.id]?.[rt.name];
        const stopIdx = result.findIndex(s => s.id === st.id);

        if (directData && directData.t1 != null) {
          result[stopIdx].arrivals.push({
            route: rt.name,
            type: rt.type,
            desc: routeDesc,
            t1: directData.t1,
            t2: directData.t2,
            isEstimated: false,
            isTimetable: false
          });
        } else if (baseT1 != null) {
          let offset = 0;
          if (st.id === 'foreign_in') offset = 2.0;
          else if (st.id === 'life_in') offset = 3.5;
          else if (st.id === 'square_in') offset = 5.0;

          const estT1 = Math.max(1, Math.round(baseT1 + offset));
          const estT2 = baseT2 != null ? Math.max(estT1 + 4, Math.round(baseT2 + offset)) : null;

          result[stopIdx].arrivals.push({
            route: rt.name,
            type: rt.type,
            desc: routeDesc,
            t1: estT1,
            t2: estT2,
            isEstimated: !isTimetableUsed,
            isTimetable: isTimetableUsed
          });
        } else {
          result[stopIdx].arrivals.push({
            route: rt.name,
            type: rt.type,
            desc: routeDesc,
            t1: null,
            t2: null,
            isEstimated: false,
            isTimetable: false
          });
        }
      });

    } else {
      let baseT1 = raw['square_out']?.[rt.name]?.t1;
      let baseT2 = raw['square_out']?.[rt.name]?.t2;
      let isSquareApi = baseT1 != null;
      let isTimetableUsed = false;

      if (!isSquareApi) {
        const tt = getTimetableDeparture(rt);
        if (tt) {
          baseT1 = tt.t1;
          baseT2 = tt.t2;
          isTimetableUsed = true;
        }
      }

      let gateT1 = raw['gate_out']?.[rt.name]?.t1;

      stations.forEach(st => {
        let directData = raw[st.id]?.[rt.name];
        const stopIdx = result.findIndex(s => s.id === st.id);

        if (directData && directData.t1 != null) {
          result[stopIdx].arrivals.push({
            route: rt.name,
            type: rt.type,
            desc: routeDesc,
            t1: directData.t1,
            t2: directData.t2,
            isEstimated: false,
            isTimetable: false
          });
        } else if (baseT1 != null) {
          let offset = 0;
          if (st.id === 'square_out') offset = 0;
          else if (st.id === 'life_out') offset = 1.5;
          else if (st.id === 'foreign_out') offset = 3.0;
          else if (st.id === 'gate_out') offset = 5.0;

          const estT1 = Math.max(1, Math.round(baseT1 + offset));
          const estT2 = baseT2 != null ? Math.max(estT1 + 4, Math.round(baseT2 + offset)) : null;

          result[stopIdx].arrivals.push({
            route: rt.name,
            type: rt.type,
            desc: routeDesc,
            t1: estT1,
            t2: estT2,
            isEstimated: !isTimetableUsed,
            isTimetable: isTimetableUsed
          });
        } else if (gateT1 != null) {
          let minusOffset = 0;
          if (st.id === 'square_out') minusOffset = 5.0;
          else if (st.id === 'life_out') minusOffset = 3.5;
          else if (st.id === 'foreign_out') minusOffset = 2.0;

          const estT1 = Math.max(1, Math.round(gateT1 - minusOffset));
          result[stopIdx].arrivals.push({
            route: rt.name,
            type: rt.type,
            desc: routeDesc,
            t1: estT1,
            t2: null,
            isEstimated: true,
            isTimetable: false
          });
        } else {
          result[stopIdx].arrivals.push({
            route: rt.name,
            type: rt.type,
            desc: routeDesc,
            t1: null,
            t2: null,
            isEstimated: false,
            isTimetable: false
          });
        }
      });
    }
  });

  return result;
}

const isDesktop = () => (state.layout === 'auto' ? window.innerWidth >= 900 : state.layout === 'desktop');
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const mins = (n) => (n <= 1 ? '<span class="soon">곧 도착</span>' : `${n}<small>분</small>`);
const ago = () => Math.round((Date.now() - state.updatedAt) / 1000);

const svg = (d, cls = '') => `<svg ${cls ? `class="${cls}"` : ''} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I = {
  logo: svg('<path d="M4 21V5l8-3 8 3v16"/><path d="M9 21v-5h6v5"/><path d="M8 8h2M14 8h2M8 12h2M14 12h2"/>'),
  back: svg('<path d="m15 6-6 6 6 6"/>'),
  arrow: svg('<path d="M5 12h14M13 6l6 6-6 6"/>'),
  refresh: svg('<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>'),
  info: svg('<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>')
};

function topBar(title) {
  if (!title) {
    return `<div class="top-row">
      <div class="brand">${I.logo}Campus Pass</div>
      <span class="spacer"></span>
      <div class="lang">
        <button type="button" aria-pressed="true">한국어</button>
      </div>
    </div>`;
  }
  return `<div class="top-row">
    <button type="button" class="home-btn" data-go="landing">${I.back}처음으로</button>
    <h1 class="page-title">${title}</h1>
    ${isDesktop() ? `<div class="brand" style="font-size:14px;opacity:.85">${I.logo}Campus Pass</div>` : ''}
  </div>`;
}

function landingView() {
  const processed = getProcessedStopArrivals('inbound');
  const gateArrivals = processed[0].arrivals;
  const quickest = gateArrivals.filter(a => a.t1 != null).sort((a, b) => a.t1 - b.t1)[0] || gateArrivals[0];

  return `<header class="top">${topBar()}</header>
    <div class="landing scroll">
      <p class="landing-lead">경희대학교 국제캠퍼스 스마트 셔틀 & 버스 가이드</p>
      <div class="choices">
        <button type="button" class="choice choice-bus" data-go="bus">
          <span>
            <span class="choice-title" style="display:block">버스 실시간 도착</span>
            <span class="choice-alt" style="display:block">Bus Realtime Arrival</span>
          </span>
          <span class="next">
            <b>${quickest.t1 ? `${quickest.t1}분` : '운행종료'}</b>
            <span>정문 기준 · ${esc(quickest.route)} (${esc(quickest.desc)})</span>
          </span>
          <span class="choice-desc">교내 노선 구간 이동시간 및 기점 출발 시간표 자동 연동 지원</span>
          <span class="choice-go">버스 도착 확인하기 ${I.arrow}</span>
        </button>

        <button type="button" class="choice choice-map" data-go="map">
          <span>
            <span class="choice-title" style="display:block">캠퍼스 건물/강의실 지도</span>
            <span class="choice-alt" style="display:block">Campus Room Map</span>
          </span>
          <span class="choice-desc">강의실 코드로 건물, 층, 방 위치를 빠르게 조회합니다.</span>
          <span class="choice-go">지도 조회하기 ${I.arrow}</span>
        </button>
      </div>
      <p class="landing-foot">경희대학교 국제캠퍼스 맞춤형 목업 서비스</p>
    </div>`;
}

function busView() {
  const stopsData = getProcessedStopArrivals(state.direction);

  const directionTabs = `<div class="direction-tabs" role="tablist">
    <button type="button" role="tab" aria-selected="${state.direction === 'inbound'}" data-dir="inbound">
      들어오는 방향 (사색의 광장 行)
    </button>
    <button type="button" role="tab" aria-selected="${state.direction === 'outbound'}" data-dir="outbound">
      나가는 방향 (정문·시외 行)
    </button>
  </div>`;

  const offsetNotice = `<div class="offset-info-box">
    ${I.info}
    <div>
      <strong>보정 및 시간표 계산 안내:</strong><br>
      · 교내 API 미제공 노선은 주요 기준점(기점 및 정문)의 데이터를 기반으로 이동 시간을 자동 가산합니다.<br>
      · 대기 중이거나 API 미인식 시 노선 정시 시간표 및 배차간격을 자동 적용합니다.
    </div>
  </div>`;

  const meta = `<div class="bus-meta">
    <div class="bus-meta-l">
      <span class="badge-sample">${state.dataMode === 'sim' ? '시뮬레이션 모드' : '실시간 API 모드'}</span>
      <span id="ago">${ago()}초 전 업데이트</span>
    </div>
    <button type="button" class="refresh" data-refresh>${I.refresh}새로고침</button>
  </div>`;

  const stopsHtml = `<div class="stops">${stopsData.map(s => `
    <section class="stop">
      <div class="stop-header">
        <h2>${esc(s.name.ko)}</h2>
        <span class="stop-where">${esc(s.where.ko)}</span>
      </div>
      <table class="arrivals"><tbody>
        ${s.arrivals.map(a => `<tr>
          <td style="width:68px">
            <span class="route route-${a.type}">${esc(a.route)}</span>
          </td>
          <td class="dest">
            ${esc(a.desc)}
            ${a.isEstimated ? '<br><span class="badge-est">[기준점 추정]</span>' : ''}
            ${a.isTimetable ? '<br><span class="badge-schedule">[시간표 기준]</span>' : ''}
          </td>
          <td class="t1 ${a.t1 == null ? 'ended' : a.t1 <= 1 ? 'soon' : ''}">
            ${a.t1 == null ? '운행종료' : mins(a.t1)}
            ${a.t2 != null ? `<span class="t2">다음 ${a.t2}분</span>` : ''}
          </td>
        </tr>`).join('')}
      </tbody></table>
    </section>
  `).join('')}</div>`;

  if (!isDesktop()) {
    return `<header class="top">${topBar('버스 정보')}</header>
      <div class="main scroll">
        ${directionTabs}
        ${offsetNotice}
        ${meta}
        ${stopsHtml}
      </div>`;
  }

  return `<header class="top">${topBar('버스 정보')}</header>
    <div class="main" style="padding-bottom:0">
      ${directionTabs}
      <div class="bus-cols">
        <div class="map-side scroll">
          <h2>캠퍼스 노선 경로</h2>
          ${offsetNotice}
          <div class="map-wrap">
            <svg viewBox="0 0 360 260">
              <rect width="360" height="260" fill="#f8f9fa"/>
              <path d="M 60 220 Q 140 170, 210 110 T 280 50" fill="none" stroke="#9b1b30" stroke-width="4" stroke-dasharray="6 4"/>
              ${STATIONS[state.direction].map((st, i) => `
                <circle cx="${st.pos.x}" cy="${st.pos.y}" r="8" fill="#9b1b30"/>
                <circle cx="${st.pos.x}" cy="${st.pos.y}" r="4" fill="#fff"/>
                <text x="${st.pos.x + 12}" y="${st.pos.y + 4}" font-size="12" font-weight="700" fill="#15171c">${i + 1}. ${esc(st.name.ko)}</text>
              `).join('')}
            </svg>
          </div>
        </div>
        <div class="scroll">
          ${meta}
          ${stopsHtml}
        </div>
      </div>
    </div>`;
}

function mapView() {
  return `<header class="top">${topBar('캠퍼스 지도')}</header>
    <div class="main scroll" style="padding: 16px;">
      <div style="background:#fff; padding:20px; border-radius:12px; border:1px solid var(--line); text-align:center;">
        <h2 style="font-size:18px; margin-bottom:8px;">캠퍼스 건물 검색</h2>
        <p style="font-size:13px; color:var(--ink-2);">전자정보대학관, 외국어대학, 생명과학대학, 멀티미디어관 등의 강의실 위치를 확인하세요.</p>
        <div style="margin-top:16px; padding:12px; background:var(--ground); border-radius:8px; font-size:14px; font-weight:600;">
          📍 예시: 전자정보대학관 201호
        </div>
      </div>
    </div>`;
}

const $app = document.getElementById('app');
const $stage = document.getElementById('stage');

function render() {
  const desk = isDesktop();
  $stage.className = 'stage ' + (desk ? 'desktop' : 'phone');
  $app.classList.toggle('desktop', desk);

  document.querySelectorAll('[data-layout]').forEach(b => b.setAttribute('aria-pressed', b.dataset.layout === state.layout));
  document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === state.dataMode));

  if (state.page === 'landing') $app.innerHTML = landingView();
  else if (state.page === 'bus') $app.innerHTML = busView();
  else if (state.page === 'map') $app.innerHTML = mapView();
}

setInterval(() => {
  const el = document.getElementById('ago');
  if (el) el.textContent = `${ago()}초 전 업데이트`;
}, 1000);

setInterval(() => {
  if (state.dataMode === 'api') fetchRealApiData();
}, 30000);

window.addEventListener('resize', () => {
  if (state.layout === 'auto') render();
});

document.querySelectorAll('[data-layout]').forEach(b => {
  b.addEventListener('click', () => {
    state.layout = b.dataset.layout;
    render();
  });
});

document.querySelectorAll('[data-mode]').forEach(b => {
  b.addEventListener('click', () => {
    state.dataMode = b.dataset.mode;
    if (state.dataMode === 'sim') {
      state.busRawData = generateSimulationData();
      state.updatedAt = Date.now();
      render();
    } else {
      fetchRealApiData();
    }
  });
});

$app.addEventListener('click', (e) => {
  const goBtn = e.target.closest('[data-go]');
  if (goBtn) {
    state.page = goBtn.dataset.go;
    render();
    return;
  }

  const dirBtn = e.target.closest('[data-dir]');
  if (dirBtn) {
    state.direction = dirBtn.dataset.dir;
    render();
    return;
  }

  const refreshBtn = e.target.closest('[data-refresh]');
  if (refreshBtn) {
    if (state.dataMode === 'api') fetchRealApiData();
    else {
      state.busRawData = generateSimulationData();
      state.updatedAt = Date.now();
      render();
    }
    return;
  }
});

fetchRealApiData();
</script>
</body>
</html>
