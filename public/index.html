<script>
// 기존 STATE 및 기본 렌더링 변수 유지
let STOPS = [];
let clockOffset = 0; // 서버시각 - 기기시각 오차

// M5107 및 1560 노선 대상
const TARGET_OFFSET_ROUTES = ['M5107', '1560'];

// 정문 도착 시각(ETA)을 기준으로 캠퍼스 내부 정류장 시간 자동 계산
function applyGateOffsets(stops, fetchedAt) {
  const mainGate = stops.find((s) => s.id === 'main-gate');
  if (!mainGate) return;

  TARGET_OFFSET_ROUTES.forEach((routeName) => {
    const gateBus = mainGate.arrivals.find((a) => a.route === routeName);
    if (!gateBus || gateBus.eta1 == null) return;

    stops.forEach((stop) => {
      // 1. 들어오는 방향 (Inbound): 정문 -> 외대(+2분) -> 생명대(+4분)
      if (stop.dir === 'in' && stop.id !== 'main-gate') {
        const hasRoute = stop.arrivals.some((a) => a.route === routeName);
        if (!hasRoute) {
          const offsetMinutes = stop.id === 'foreign' ? 2 : 4;
          const offsetMs = offsetMinutes * 60 * 1000;
          
          stop.arrivals.push({
            route: routeName,
            dest: { ko: '사색의 광장 방면', en: 'Inbound' },
            t1: gateBus.t1 != null ? gateBus.t1 + offsetMinutes : null,
            t2: null,
            eta1: gateBus.eta1 + offsetMs,
            eta2: null,
            isOffsetCalculated: true // 오프셋 보정 적용 표시
          });
        }
      }

      // 2. 나가는 방향 (Outbound): 정문 통과 전 역산 (-2분 ~ -6분)
      if (stop.dir === 'out') {
        const hasRoute = stop.arrivals.some((a) => a.route === routeName);
        if (!hasRoute) {
          let minusMinutes = 2; // 경희대체육대학·외대 (-2분)
          if (stop.id === 'lifesci-ind') minusMinutes = 4; // 생명과학대·산업대학 (-4분)
          if (stop.id === 'square') minusMinutes = 6;      // 사색의 광장 (-6분)

          const offsetMs = minusMinutes * 60 * 1000;
          const calculatedEta = gateBus.eta1 - offsetMs;

          // 이미 지난 시각이 아닌 경우에만 추가
          if (calculatedEta > fetchedAt) {
            stop.arrivals.push({
              route: routeName,
              dest: { ko: '정문/차고지 방면', en: 'Outbound' },
              t1: Math.max(0, Math.round((calculatedEta - fetchedAt) / 60000)),
              t2: null,
              eta1: calculatedEta,
              eta2: null,
              isOffsetCalculated: true
            });
          }
        }
      }
    });
  });
}

// 실시간 버스 데이터 로드
async function loadStops() {
  try {
    const sent = Date.now();
    const res = await fetch('/api/bus', { cache: 'no-store' });
    const j = await res.json();
    const recv = Date.now();

    // 1. 네트워크 지연 및 시계 오차 보정
    clockOffset = j.fetchedAt - (sent + recv) / 2;

    // 2. 분 단위 -> 절대 도착 시간(ETA ms) 변환
    j.stops.forEach((stop) => {
      stop.arrivals.forEach((a) => {
        a.eta1 = a.t1 != null ? j.fetchedAt + a.t1 * 60000 : null;
        a.eta2 = a.t2 != null ? j.fetchedAt + a.t2 * 60000 : null;
      });
    });

    // 3. M5107, 1560 정문 기준 오프셋 보정 계산 적용
    applyGateOffsets(j.stops, j.fetchedAt);

    STOPS = j.stops;
    state.updatedAt = j.fetchedAt - clockOffset;
  } catch (err) {
    console.error('Bus data fetch failed:', err);
  }
  render();
}

// 브라우저에서 초 단위로 남은 시간 계산
const serverNow = () => Date.now() + clockOffset;
const remainMin = (eta) => (eta == null ? null : Math.max(0, Math.round((eta - serverNow()) / 60000)));

// 초기 로드 및 30초 주기 API 갱신
loadStops();
setInterval(loadStops, 30000);

// 매초 UI 상 남은 분(min) 텍스트 업데이트 (화면 전체 재렌더링 없이 숫자만 차감)
setInterval(() => {
  const agoEl = document.getElementById('ago');
  if (agoEl) agoEl.textContent = t('updated')(ago());

  document.querySelectorAll('td.t1[data-eta]').forEach((td) => {
    const eta = Number(td.dataset.eta);
    if (!eta) return;
    const m = remainMin(eta);
    if (m == null) return;
    
    td.firstChild.textContent = m <= 1 ? t('soon') : m;
    td.classList.toggle('soon', m <= 1);
  });
}, 1000);

// 탭 전환 시 화면 자동 갱신
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) loadStops();
});
</script>
