<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Pass</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/css/common.css">
<style>
  .choices { padding: 20px 16px; display: flex; flex-direction: column; gap: 16px; }
  .choice-card { padding: 24px; border-radius: 16px; color: #fff; text-decoration: none; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
  .card-bus { background: #1d2027; }
  .card-map { background: var(--crimson); }
  .card-campus { background: #2f5d3a; }
  .card-title { font-size: 22px; font-weight: 800; }
  .card-desc { font-size: 13px; opacity: 0.85; line-height: 1.4; }
  .brand { margin-top: auto; padding: 12px 0 4px; display: flex; justify-content: center; }
  .brand img { width: 180px; max-width: 55%; height: auto; display: block; }
</style>
</head>
<body>
<div class="stage">
  <div class="device">
    <header class="top">
      <h1>Campus Pass</h1>
    </header>
    <main class="choices">
      <a href="/bus.html" class="choice-card card-bus">
        <span class="card-title">🚌 버스 실시간 도착</span>
        <span class="card-desc">학교내 정류소별 실시간 버스 도착정보 확인</span>
      </a>
      <a href="/map.html" class="choice-card card-map">
        <span class="card-title">🗺️ 강의실 위치 찾기</span>
        <span class="card-desc">수업 강의실 검색 및 위치 확인</span>
      </a>
      <a href="/campusmap.html" class="choice-card card-campus">
        <span class="card-title">🏫 국제캠퍼스 지도</span>
        <span class="card-desc">캠퍼스 내 건물 위치 확인</span>
      </a>
      <footer class="brand">
        <img src="/khu_emblem.png" alt="경희대학교 휘장">
      </footer>
    </main>
  </div>
</div>
</body>
</html>
