<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campus Pass Mockup - 경희대학교 버스 도착 예측</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --crimson: #9b1b30;
    --crimson-deep: #6f1222;
    --crimson-tint: #f6e6e9;
    --ground: #eef0f3;
    --surface: #ffffff;
    --ink: #15171c;
    --ink-2: #4f5562;
    --line: #d4d8df;
    --plate: #1d2027;
    --plate-ink: #ffffff;
    --plate-ink-2: #b9bec9;
    --amber-tint: #fdf0dc;
    --amber-ink: #6b3b00;
    --focus: #1d5fd1;
    --radius: 12px;
    --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #c9ced6;
    font-family: var(--font);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }
  ::selection { background: var(--crimson); color: #fff; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  h1, h2, h3 { margin: 0; }

  /* Top Review Control Bar */
  .review {
    flex: none;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 16px;
    background: #2a2e36; color: #dfe2e8; font-size: 13px;
    flex-wrap: wrap;
  }
  .review-group { display: flex; align-items: center; gap: 8px; }
  .review-seg { display: inline-flex; background: #15171c; border-radius: 8px; padding: 3px; }
  .review-seg button { border: 0; background: transparent; color: #b9bec9; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 6px; min-height: 28px; }
  .review-seg button[aria-pressed="true"] { background: #fff; color: var(--ink); }
  .review-note { color: #9aa0ab; font-size: 12px; }

  .stage { flex: 1; min-height: 0; display: flex; }
  .stage.phone { align-items: safe center; justify-content: center; padding: 16px; overflow: auto; }
  .device {
    width: 390px; height: 844px; flex: none;
    border-radius: 36px; border: 10px solid #101216;
    box-shadow: 0 30px 60px -20px rgba(16, 18, 22, 0.45);
    overflow: hidden; position: relative; background: var(--ground);
  }
  @media (max-width: 500px) {
    .stage.phone { padding: 0; }
    .stage.phone .device { width: 100%; height: 100%; border: 0; border-radius: 0; box-shadow: none; }
  }
  .stage.desktop .device { width: 100%; height: 100%; border: 0; border-radius: 0; box-shadow: none; }

  .app { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--ground); }

  /* Top App Bar */
  .top { background: var(--crimson); color: #fff; padding: 12px 16px; flex: none; }
  .top-row { display: flex; align-items: center; gap: 8px; min-height: 40px; }
  .brand { font-weight: 750; font-size: 18px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
  .brand svg { width: 22px; height: 22px; }
  .page-title { font-weight: 700; font-size: 17px; flex: 1; min-width: 0; }
  .spacer { flex: 1; }
  .home-btn {
    border: 0; background: var(--crimson-deep); color: #fff; display: inline-flex; align-items: center; gap: 2px;
    font-size: 13px; font-weight: 650; padding: 0 10px 0 4px; border-radius: 8px; min-height: 36px; flex: none;
  }
  .home-btn:hover { background: #5a0e1b; }
  .home-btn svg { width: 18px; height: 18px; }
  .lang { display: inline-flex; background: var(--crimson-deep); border-radius: 999px; padding: 3px; flex: none; }
  .lang button { border: 0; background: transparent; color: #f2d3d9; font-size: 12px; font-weight: 650; padding: 3px 9px; border-radius: 999px; min-height: 26px; }
  .lang button[aria-pressed="true"] { background: #fff; color: var(--crimson-deep); }

  .scroll { overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .main { flex: 1; min-height: 0; padding-bottom: 24px; display: flex; flex-direction: column; }

  /* Landing Screen */
  .landing { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 20px 16px 24px; gap: 14px; }
  .landing-lead { font-size: 15px; color: var(--ink-2); line-height: 1.5; margin: 0 2px 2px; }
  .choices { display: flex; flex-direction: column; gap: 12px; flex: 1; }
  .choice {
    flex: 1; border: 0; border-radius: 16px; text-align: left; padding: 20px;
    display: flex; flex-direction: column; justify-content: space-between; gap: 16px;
    position: relative; overflow: hidden; min-height: 180px;
    box-shadow: 0 10px 24px -14px rgba(16, 18, 22, 0.5);
    transition: transform 200ms var(--ease-out), box-shadow 200ms var(--ease-out);
  }
  .choice:hover { transform: translateY(-2px); box-shadow: 0 14px 28px -12px rgba(16, 18, 22, 0.6); }
  .choice-map { background: var(--crimson); color: #fff; }
  .choice-bus { background: var(--plate); color: #fff; }
  .choice-title { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; }
  .choice-alt { font-size: 14px; font-weight: 550; opacity: 0.75; margin-top: 2px; }
  .choice-desc { font-size: 14px; line-height: 1.45; color: rgba(255,255,255,0.85); }
  .choice-go { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-size: 14px; }
  .choice-go svg { width: 18px; height: 18px; }
  .choice-bus .next { display: flex; align-items: baseline; gap: 8px; }
  .choice-bus .next b { font-size: 38px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1; }
  .choice-bus .next span { font-size: 13px; color: var(--plate-ink-2); }
  .landing-foot { font-size: 12px; color: var(--ink-2); text-align: center; }

  /* Bus View Specifics */
  .direction-tabs {
    display: flex; background: var(--surface); margin: 12px 16px 4px; border-radius: 10px;
    padding: 3px; border: 1px solid var(--line);
  }
  .direction-tabs button {
    flex: 1; border: 0; background: transparent; padding: 10px 8px; border-radius: 8px;
    font-size: 14px; font-weight: 700; color: var(--ink-2); text-align: center;
    transition: all 180ms ease;
  }
  .direction-tabs button[aria-selected="true"] {
    background: var(--crimson); color: #fff; box-shadow: 0 2px 6px rgba(155, 27, 48, 0.3);
  }

  .offset-info-box {
    margin: 8px 16px; padding: 10px 12px; background: var(--amber-tint); color: var(--amber-ink);
    border-radius: 8px; font-size: 12px; line-height: 1.45; display: flex; align-items: flex-start; gap: 8px;
  }
  .offset-info-box svg { width: 16px; height: 16px; flex: none; margin-top: 1px; }

  .bus-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 16px 4px; }
  .bus-meta-l { font-size: 12px; color: var(--ink-2); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .badge-sample { background: var(--amber-tint); color: var(--amber-ink); font-weight: 650; border-radius: 999px; padding: 2px 8px; font-size: 11px; }
  .badge-est { background: #fff3e0; color: #e65100; border: 1px solid #ffe0b2; font-weight: 650; border-radius: 4px; padding: 1px 5px; font-size: 10px; display: inline-block; }
  .badge-schedule { background: #e3f2fd; color: #0d47a1; border: 1px solid #bbdefb; font-weight: 650; border-radius: 4px; padding: 1px 5px; font-size: 10px; display: inline-block; }

  .refresh { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; min-height: 36px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
  .refresh:hover { border-color: var(--ink-2); }
  .refresh svg { width: 14px; height: 14px; }

  .stops { display: grid; gap: 12px; padding: 6px 16px 16px; }
  .stop { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .stop-header { display: flex; justify-content: space-between; align-items: baseline; }
  .stop h2 { font-size: 16px; font-weight: 750; }
  .stop-where { font-size: 12px; color: var(--ink-2); margin-top: 2px; }

  .arrivals { width: 100%; border-collapse: collapse; margin-top: 8px; }
  .arrivals td { padding: 8px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .arrivals tr:last-child td { border-bottom: 0; }

  .route { display: inline-block; min-width: 52px; text-align: center; font-weight: 750; font-size: 13px; padding: 3px 6px; border-radius: 6px; border: 1.5px solid var(--ink); font-variant-numeric: tabular-nums; }
  .route-m { border-color: #0055b8; color: #0055b8; background: #eef5fc; }
  .route-red { border-color: #d32f2f; color: #d32f2f; background: #fdeaea; }
  .route-green { border-color: #2e7d32; color: #2e7d32; background: #eef7ee; }

  .dest { font-size: 13px; color: var(--ink); padding-left: 8px !important; }

  .t1 { text-align: right; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .t1 small { font-size: 12px; font-weight: 600; margin-left: 0.15em; }
  .t1.soon { color: var(--crimson); }
  .t2 { display: block; font-size: 11px; font-weight: 500; color: var(--ink-2); }
  .t1.ended { font-size: 13px; color: var(--ink-2); font-weight: 600; }

  /* Map View UI */
  .map-wrap { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--line); overflow: hidden; }
  .map-wrap svg { display: block; width: 100%; height: auto; }

  /* Desktop layout tweaks */
  .desktop .top { padding: 10px 24px; }
  .desktop .landing { align-items: center; justify-content: center; padding: 40px 24px; gap: 20px; }
  .desktop .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: min(960px, 100%); }
  .desktop .choice { min-height: 300px; padding: 24px; }
  .desktop .choice-title { font-size: 32px; }

  .bus-cols { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(340px, 1fr); }
  .bus-cols .map-side { padding: 16px 24px; border-right: 1px solid var(--line); }
  .bus-cols .map-side h2 { font-size: 20px; font-weight: 750; margin-bottom: 12px; }
  .bus-cols .stops { padding: 6px 24px 24px; }
  .desktop .bus-meta { padding: 16px 24px 6px; }
</style>
</head>
<body>

<div class="review" role="group" aria-label="Mockup view controls">

// 기점(사색의 광장) 출발 시간표 기준 남아있는 분 계산
function getTimetableDeparture(routeObj) {
  const now = new Date();
  const currentMinutes = now.getHours() * 60 + now.getMinutes();
  const startMinutes = routeObj.startHour * 60 + routeObj.startMin;
  const endMinutes = routeObj.endHour * 60 + routeObj.endMin;

  if (currentMinutes < startMinutes || currentMinutes > endMinutes) {
    return null; // 운행시간 외 (운행종료)
  }

  const elapsed = currentMinutes - startMinutes;
  const nextIn = routeObj.interval - (elapsed % routeObj.interval);
  const nextT1 = nextIn === 0 ? routeObj.interval : nextIn;
  const nextT2 = nextT1 + routeObj.interval;

  return { t1: nextT1, t2: nextT2, isTimetable: true };
}
