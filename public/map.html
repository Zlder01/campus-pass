<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>캠퍼스 층별 안내도</title>
  <link rel="stylesheet" href="/css/common.css">
  <style>
    .map-controls { margin-bottom: 16px; display: flex; gap: 12px; flex-wrap: wrap; }
    .floor-btn { padding: 6px 12px; border: 1px solid #ced4da; background: #fff; border-radius: 6px; cursor: pointer; }
    .floor-btn.active { background: #8b0029; color: #fff; border-color: #8b0029; font-weight: bold; }
    .floor-plan-view { width: 100%; text-align: center; background: #f8f9fa; border-radius: 12px; padding: 12px; }
    .floor-plan-view img { max-width: 100%; height: auto; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="device">
      <header class="top">
        <a href="/" class="home-btn">홈</a>
        <h1>캠퍼스 건물 층별 안내</h1>
      </header>
      
      <main class="scroll">
        <!-- 건물 및 층 선택 영역 -->
        <div class="map-controls">
          <select id="buildingSelect" class="form-select"></select>
          <div id="floorButtons" class="floor-btns"></div>
        </div>

        <!-- 층별 도면 표시 영역 (.jpg) -->
        <div class="floor-plan-view">
          <img id="floorPlanImg" src="" alt="건물 도면">
        </div>
      </main>
    </div>
  </div>

  <script src="/js/map.js"></script>
</body>
</html>
